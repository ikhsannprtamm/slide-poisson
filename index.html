{t:'Apa itu distribusi Poisson?',rows:[['Pengertian','Distribusi Poisson adalah distribusi peluang diskrit yang menggambarkan banyaknya kejadian dalam suatu selang waktu, panjang, atau luas tertentu.'],['Jenis data','Yang dihitung berupa cacah kejadian: 0, 1, 2, 3, dan seterusnya, bukan angka pecahan.'],['Contoh','Pelanggan yang datang ke loket per jam, salah ketik per halaman, atau cacat produk per 100 unit.'],['Kata kunci','Di soal biasanya muncul kalimat “rata-rata … per …”.']],v:'dots',c:'Tiap kotak = satu selang waktu; angkanya jumlah kejadian',n:'Mulai dari pertanyaan sehari-hari: berapa pelanggan yang datang ke loket dalam satu jam? Tekankan bahwa yang dihitung adalah jumlah kejadian, dan kata kuncinya “rata-rata per”.'},

{t:'Ciri-ciri percobaan Poisson',rows:[['Saling bebas','Satu kejadian tidak memengaruhi kejadian lain. Mahasiswa yang datang ke loket tidak membuat mahasiswa lain ikut datang.'],['Laju konstan','Rata-rata kejadian per satuan selang dianggap tetap, misalnya sekitar 5 mahasiswa per jam.'],['Tidak serentak','Dua kejadian atau lebih pada selang yang sangat pendek bisa diabaikan.']],big:['Bebas · Konstan · Tidak serentak','Tiga syarat agar Poisson cocok'],n:'Pakai contoh mahasiswa yang datang ke loket untuk menjelaskan ketiga ciri.'},
{t:'Rata-rata sama dengan variansi',rows:[['Sifat','Rata-rata dan variansi sama besar, yaitu λ. Simpangan bakunya adalah akar dari λ.'],['Kegunaan','Sifat ini menjadi petunjuk awal apakah data cacah cocok dimodelkan dengan Poisson.'],['Overdispersi','Jika variansi data jauh lebih besar dari rata-ratanya, Poisson biasa kurang tepat dipakai. Biasanya dipakai distribusi alternatif.']],big:['Rata-rata = Variansi = λ','Ciri khas distribusi Poisson'],n:'Ini ciri khas Poisson. Jika data tidak memenuhi sifat ini, disebut overdispersi dan model Poisson biasa kurang cocok.'},

{t:'Hubungan dengan distribusi lain',rows:[['Binomial','Poisson adalah pendekatan binomial ketika jumlah percobaan besar dan peluang sukses kecil. Karena itu Bortkiewicz menyebutnya “hukum bilangan kecil”.'],['Eksponensial','Poisson menghitung berapa banyak kejadian, sedangkan eksponensial mengukur berapa lama menunggu kejadian berikutnya.'],['Normal','Untuk λ yang besar, bentuk Poisson mendekati kurva lonceng distribusi normal.'],['Penjumlahan','Dua Poisson yang saling bebas, jika dijumlahkan, tetap Poisson dengan λ yang dijumlahkan.']],big:['Poisson: “berapa banyak”','Eksponensial: “berapa lama” menunggu'],n:'Bagian ini penting untuk pertanyaan dosen. Beda dengan binomial: binomial menghitung sukses dalam n percobaan tetap, Poisson menghitung kejadian dalam selang tanpa batas atas.'},

{t:'Studi kasus 2: bug pada kode',rows:[['Kasus','Tim QA mengaudit 200 modul perangkat lunak, masing-masing sepanjang 1.000 baris kode.'],['Data','Ditemukan 240 bug, sehingga rata-ratanya 1,2 bug per modul.'],['Hasil','0 bug: 60 modul (harapan 60,24). 1 bug: 72 (72,28). 2 bug: 43 (43,38). 3 bug: 18 (17,34). 4 atau lebih: 7 (6,76).'],['Kesimpulan','Sebaran bug mengikuti Poisson. Peluang modul baru bebas bug sekitar 30,12%, dan paling banyak 1 bug sekitar 66,26%.']],v:'cmp',o:[60,72,43,18,7],e:[60.24,72.28,43.38,17.34,6.76],l:['0','1','2','3','≥4'],c:'Batang = data teramati · garis kuning = harapan Poisson',n:'Intinya sama dengan kasus pertama: data hampir sama persis dengan hitungan Poisson. Chi-kuadrat 0,0390, di bawah nilai kritis 7,815. Tim QA bisa memakai model ini untuk memprediksi kualitas modul baru.'},
{t:'Penerapan dan keterbatasan',rows:[['Penerapan','Antrean layanan, pengendalian kualitas, klaim asuransi, permintaan ke server, dan kasus penyakit langka.'],['Keterbatasan 1','Asumsi saling bebas sering dilanggar, misalnya pada penyakit menular atau gempa susulan.'],['Keterbatasan 2','Laju tidak selalu konstan, misalnya pelanggan ramai di jam sibuk dan sepi saat dini hari.'],['Keterbatasan 3','Rata-rata harus sama dengan variansi, dan datanya harus berupa cacah.']],big:['Cocok jika asumsinya terpenuhi','Periksa asumsi sebelum memakai Poisson'],n:'Sebutkan bidang penerapan lalu tiga keterbatasan. Sarankan untuk selalu memeriksa asumsi dan melakukan uji kecocokan sebelum memakai Poisson.'},
