:root{--sun:#f0b44c}:root.light{--bg:#f5e8d5;--ink:#1f160f;--mute:#7a6552;--gold:#a33516;--line:#d8c4a8;--card:#ebdac0;--sun:#e9a82c;color-scheme:light}
html,body,#nav{transition:background .6s,color .6s}#notes{background:var(--card);color:var(--ink)}

#dots i.on{background:var(--gold);transform:scale(1.3)}#dots i.past{background:var(--gold);opacity:.6}
